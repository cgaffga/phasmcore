# SIMD parity: every SIMD kernel against its scalar reference, on the ISAs
# that actually run it, on every push and pull request.
#
# Why this exists. The AVX2 inverse DCT shipped broken twice — an
# out-of-bounds store (fixed 2026-07-02) and wrong inter-pass register
# packing (fixed 2026-10-24) — while the scalar-parity tests that catch both
# sat in the lib test suite. Those tests only ever ran on the maintainer's
# Apple Silicon machine (NEON) and under Rosetta (no AVX2), so on x86 with
# AVX2 — Linux, Windows, Intel Macs, i.e. most CLI users — Armor produced
# garbage pixels and the encoder corrupted its own quantization tables. Both
# bugs were first found outside the project (denwong47/phasmcore, with a
# parity check under Miri). See issue #4.
#
# Two complementary gates:
#   * lib-tests  — the full lib suite natively, where the hardware has the
#                  instructions. Catches any SIMD/scalar divergence.
#   * miri       — the SIMD parity tests interpreted by Miri, once with AVX2
#                  and once at the plain SSE2 baseline that phasmcore's
#                  release builds use (no .cargo/config.toml here, so no
#                  SSE4.1). Catches out-of-bounds, aliasing and
#                  missing-target-feature undefined behaviour even when the
#                  output happens to come out right. The SSE2 run is what
#                  caught the STC Viterbi kernel calling SSE4.1 `blendvpd`
#                  unchecked (2026-10-24); the AVX2 run cannot see that,
#                  because AVX2 implies SSE4.1.

name: simd-parity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lib-tests:
    name: lib tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64 Linux, AVX2
            os: ubuntu-latest
            require_avx2: true
          - name: x86_64 Windows, AVX2
            os: windows-latest
            require_avx2: false
          - name: aarch64 Linux, NEON
            os: ubuntu-24.04-arm
            require_avx2: false
          - name: aarch64 macOS, NEON
            os: macos-latest
            require_avx2: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # The x86 gate is only worth anything if the AVX2 kernels actually run.
      - name: Require AVX2
        if: matrix.require_avx2
        shell: bash
        run: |
          grep -m1 -o -w avx2 /proc/cpuinfo || {
            echo "::error::runner has no AVX2 — the AVX2 kernels would not be tested"
            exit 1
          }

      - name: Lib tests (release)
        shell: bash
        run: cargo test --release --lib

  miri:
    name: Miri, x86_64 ${{ matrix.name }} (SIMD parity)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AVX2
            features: -C target-feature=+avx2
          - name: SSE2 baseline
            features: -C target-feature=+sse2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      # `+nightly` is required: rust-toolchain.toml pins a stable channel
      # (the paper's reproducibility pin), which would otherwise win over the
      # nightly installed above, and stable has no Miri.
      - name: Miri setup
        run: cargo +nightly miri setup --target x86_64-unknown-linux-gnu

      - name: SIMD parity tests under Miri
        env:
          RUSTFLAGS: ${{ matrix.features }}
        run: >
          cargo +nightly miri test --target x86_64-unknown-linux-gnu --lib --
          pixels_aan uniward_simd fft2d_simd optimizer_simd embedding_simd
          viterbi_step_matches_scalar_for_every_state_count
          stc_embed_h0_keeps_the_cover
          cost_precompute_simd_matches_scalar_reference_random
