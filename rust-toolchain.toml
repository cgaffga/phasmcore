# Pinned Rust toolchain for the Phasm crate.
#
# The paper's reproducibility claim (Appendix D) pins this version. The
# bit-exact CI at core/.github/workflows/bit-exact.yml must also pass on
# this toolchain across all five platforms. Bumping the channel requires
# re-triggering the CI and updating Appendix D.
#
# Why a specific channel and not "stable"? Reproducibility — `stable` is a
# moving target that floats over time. Pinning freezes the compiler so
# anyone who clones at paper-v3.1 builds with the same toolchain the paper
# was written against.
#
# Channel choice: rustc 1.99.1 (2026-10-13), bumped from 1.93.1 on
# 2026-11-02 when the machine's stable moved (maintainer decision); the
# determinism suite (tests/cross_platform.rs), the core lib and Armor suites
# passed on it. The paper's Appendix D must name this version. When tagging
# paper-v3.1, re-trigger the bit-exact CI workflow with this pin honored (the
# CI workflow currently uses dtolnay/rust-toolchain@stable; switching to
# @1.99.1 on the paper-v3.1 ref makes the pin binding).

[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
